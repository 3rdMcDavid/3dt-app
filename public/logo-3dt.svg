  <!-- Right half circuit details -->
  <g clip-path="url(#leafR)">
    <line x1="52" y1="10" x2="52" y2="70" stroke="#1b3d2a" stroke-width="0.9" opacity="0.2"/>
    <line x1="40" y1="40" x2="71" y2="40" stroke="#1b3d2a" stroke-width="1" opacity="0.25"/>
    <circle cx="52" cy="28" r="2.8" fill="#1b3d2a" opacity="0.45"/>
    <circle cx="52" cy="52" r="2.8" fill="#e8a020" opacity="0.9"/>
